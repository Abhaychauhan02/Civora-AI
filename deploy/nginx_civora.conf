# Civora Nginx Configuration - Secure HTTPS Reverse Proxy
# Supports Wildcard DNS nip.io / sslip.io with Let's Encrypt TLS

# 1. HTTP Server - ACME Challenge & Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 13.211.32.245.sslip.io 13.211.32.245.nip.io 13-211-32-245.sslip.io 13.211.32.245 _;

    # Allow Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all plain HTTP traffic to HTTPS for browser GPS secure-context
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Secure Context with TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 13.211.32.245.sslip.io 13.211.32.245.nip.io 13-211-32-245.sslip.io 13.211.32.245 _;

    # TLS Certificates (Certbot or self-signed fallback)
    ssl_certificate /etc/ssl/civora/fullchain.pem;
    ssl_certificate_key /etc/ssl/civora/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size for citizen photos
    client_max_body_size 35M;

    # Secure Context & Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy AI inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
